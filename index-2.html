<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#53c7a5"><title>Little Learners - Leo's Learning Jungle</title>
<style>
:root{--green:#54c99b;--dark:#174c3d;--sun:#ffd65a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(#9be7ff 0 42%,#a9e8a0 42%);color:var(--dark);min-height:100vh}header{text-align:center;padding:18px 12px 8px}h1{font-size:clamp(2rem,7vw,3.3rem);margin:0;text-shadow:2px 3px white}header p{margin:4px}.scene{position:relative;max-width:1000px;margin:10px auto;padding:18px 12px 24px;overflow:hidden}.sun{position:absolute;right:8%;top:5px;font-size:64px;animation:glow 3s infinite alternate}.cloud{position:absolute;top:20px;left:8%;font-size:48px;animation:drift 12s infinite alternate}.animals{display:flex;justify-content:center;align-items:end;gap:clamp(3px,2vw,20px);flex-wrap:wrap;padding:40px 0 12px}.animal{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--dark);font-weight:800;min-width:75px}.creature{font-size:clamp(58px,13vw,105px);filter:drop-shadow(0 8px 2px #397c5540);display:block;animation:bob 2.2s ease-in-out infinite;transform-origin:bottom}.animal:nth-child(2) .creature{animation-delay:.3s}.animal:nth-child(3) .creature{animation-delay:.6s}.animal:nth-child(4) .creature{animation-delay:.9s}.animal:nth-child(5) .creature{animation-delay:1.2s}.animal:active .creature{transform:scale(1.25) rotate(-8deg)}.ground{height:20px;background:#69bf65;border-radius:50%;margin:0 -20px}.panel{background:#fffdf0;border:4px solid white;border-radius:25px;padding:18px;margin:15px auto;max-width:850px;box-shadow:0 8px 0 #367c5a30;text-align:center}.panel h2{margin:0 0 10px}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:12px 17px;background:var(--sun);color:#4d421b;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #d3a83e}.btn:active{transform:translateY(3px);box-shadow:none}.btn.pink{background:#ffb5ca;box-shadow:0 4px 0 #df809b}.btn.green{background:#75dfad;box-shadow:0 4px 0 #43ad7c}.question{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:900;margin:8px}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.choice{font-size:1.5rem;min-width:72px;padding:12px;border:3px solid #bcebd7;border-radius:18px;background:white;cursor:pointer}.feedback{min-height:30px;font-weight:900;font-size:1.2rem}.footer{text-align:center;padding:12px;font-size:.9rem}.star{position:fixed;pointer-events:none;animation:fly 1s forwards;font-size:28px}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-13px) rotate(2deg)}}@keyframes drift{to{transform:translateX(60px)}}@keyframes glow{to{transform:scale(1.12)}}@keyframes fly{to{transform:translateY(-100px) rotate(180deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<header><h1>🌴 Little Learners 🦁</h1><p>Welcome to Leo's Learning Jungle!</p></header>
<main class="scene"><div class="sun">☀️</div><div class="cloud">☁️</div>
<section class="animals" aria-label="Meet the animal friends">
<button class="animal" onclick="greet('Leo')"><span class="creature">🦁</span>Leo</button>
<button class="animal" onclick="greet('Mimi')"><span class="creature">🐵</span>Mimi</button>
<button class="animal" onclick="greet('Ellie')"><span class="creature">🐘</span>Ellie</button>
<button class="animal" onclick="greet('Gigi')"><span class="creature">🦒</span>Gigi</button>
<button class="animal" onclick="greet('Pip')"><span class="creature">🦜</span>Pip</button>
</section><div class="ground"></div></main>
<section class="panel"><h2>👋 Meet your jungle friends</h2><p>Tap an animal to hear a special greeting!</p><div class="buttons"><button class="btn green" onclick="greet('Leo')">Talk to Leo</button><button class="btn pink" onclick="greet('Mimi')">Talk to Mimi</button><button class="btn" onclick="greet('Ellie')">Talk to Ellie</button><button class="btn green" onclick="greet('Gigi')">Talk to Gigi</button><button class="btn pink" onclick="greet('Pip')">Talk to Pip</button></div></section>
<section class="panel"><h2>🎓 Let's learn and play!</h2><div class="buttons"><button class="btn" onclick="startGame('number')">🔢 Number game</button><button class="btn pink" onclick="startGame('letter')">🔤 Letter game</button><button class="btn green" onclick="startGame('animal')">🐾 Animal sounds</button></div><div id="game" aria-live="polite"><p>Choose a game to begin. You can do it!</p></div><div class="feedback" id="feedback"></div><p>⭐ Stars earned: <strong id="score">0</strong></p></section>
<div class="footer">Made for curious little minds 💚</div>
<script>
const friends={Leo:{line:"Roar! I'm Leo, your brave lion friend!",pitch:.8,rate:.85},Mimi:{line:"Hi hi! I'm Mimi the playful monkey!",pitch:1.45,rate:1.15},Ellie:{line:"Hello, little learner. I'm Ellie the gentle elephant.",pitch:.7,rate:.82},Gigi:{line:"Hey there! I'm Gigi, tall and happy!",pitch:1.2,rate:.95},Pip:{line:"Squawk! Hello hello! I'm Pip the colourful parrot!",pitch:1.7,rate:1.12}};
function speak(line,pitch=1,rate=1){if(!('speechSynthesis'in window)){alert(line);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(line);u.pitch=pitch;u.rate=rate;speechSynthesis.speak(u)}
function greet(name){const f=friends[name];speak(f.line,f.pitch,f.rate);celebrate()}
function celebrate(){for(let i=0;i<5;i++){let s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(35+Math.random()*30)+'vw';s.style.top=(45+Math.random()*20)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}}
let score=0,answer='';
const sets={number:[{q:'How many stars? ⭐⭐⭐',a:'3',opts:['2','3','4']},{q:'What comes after 4?',a:'5',opts:['3','5','7']},{q:'What is 2 + 1?',a:'3',opts:['1','2','3']}],letter:[{q:'Which letter does Apple start with?',a:'A',opts:['B','A','C']},{q:'Find the letter B',a:'B',opts:['D','B','P']},{q:'Which letter does Lion start with?',a:'L',opts:['M','L','S']}],animal:[{q:'Who says ROAR?',a:'🦁 Lion',opts:['🐘 Elephant','🦁 Lion','🐵 Monkey']},{q:'Who has a long trunk?',a:'🐘 Elephant',opts:['🦒 Giraffe','🦜 Parrot','🐘 Elephant']},{q:'Who can squawk?',a:'🦜 Parrot',opts:['🦜 Parrot','🦁 Lion','🐘 Elephant']}]};
function startGame(type){let item=sets[type][Math.floor(Math.random()*sets[type].length)];answer=item.a;document.getElementById('feedback').textContent='';let box=document.getElementById('game');box.replaceChildren();let q=document.createElement('div');q.className='question';q.textContent=item.q;box.append(q);let choices=document.createElement('div');choices.className='choices';item.opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>checkAnswer(o);choices.append(b)});box.append(choices)}
function checkAnswer(choice){let f=document.getElementById('feedback');if(choice===answer){score++;document.getElementById('score').textContent=score;f.textContent='🎉 Amazing! That is correct!';speak('Wonderful job! You got it right!');celebrate()}else{f.textContent='😊 Good try! Have another go!';speak('Good try! You can do it!')}}
</script></body></html>
